<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Resolve theme and sidebar state before first paint (no flash).
  (function () {
    var r = document.documentElement, t = "system", s = null;
    try { t = localStorage.getItem("theme") || "system"; s = localStorage.getItem("sidebar"); } catch (e) {}
    var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    r.dataset.theme = dark ? "dark" : "light";
    r.dataset.themePref = t;
    if (s === "collapsed") r.dataset.sidebar = "collapsed";
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
